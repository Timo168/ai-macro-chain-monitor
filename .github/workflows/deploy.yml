name: Update data and deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: macro-data-and-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r scripts/requirements.txt
      - name: Restore durable data branch
        run: python scripts/github-data-state.py restore
      - name: Collect official observations and check release calendars
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MACRO_SCHEDULER: github_actions
          MACRO_CHECK_MINUTES: '30'
        run: |
          if [ ! -f data/observations.sqlite ]; then python scripts/collect.py; fi
          python scripts/schedule.py
      - name: Persist cache and revisions even if a later build fails
        if: always()
        run: python scripts/github-data-state.py save
      - name: Verify calculations and collector
        run: |
          node --test tests/calculations.test.mjs
          node --test tests/industry.test.mjs
          python tests/collector_test.py
          python tests/industry_collector_test.py
          python tests/policy_rates_test.py
          python scripts/audit_industry.py
          npx tsc --noEmit
      - name: Build website
        env:
          PAGES_BASE_PATH: /ai-macro-chain-monitor/
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
