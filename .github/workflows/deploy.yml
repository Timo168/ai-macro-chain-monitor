name: Update data and deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Audit industry data sources]
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: macro-data-and-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Restore frontend built from this exact source version
        id: frontend
        uses: actions/cache/restore@v4
        with:
          path: dist-pages
          key: pages-shell-v1-${{ runner.os }}-${{ github.sha }}-${{ hashFiles('package-lock.json') }}-ai-macro-chain-monitor
      - name: Verify cached frontend identity and asset checksums
        id: frontend-proof
        env:
          PAGES_BASE_PATH: /ai-macro-chain-monitor/
          CACHE_HIT: ${{ steps.frontend.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = 'true' ] && node scripts/build-pages.mjs --check-frontend; then
            echo 'reusable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'reusable=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install frontend dependencies for a new source version
        if: steps.frontend-proof.outputs.reusable != 'true'
        run: npm ci
      - name: Install collector dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Restore durable data branch
        run: python scripts/github-data-state.py restore
      - name: Collect official observations and check release calendars
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          MACRO_SCHEDULER: github_actions
          MACRO_CHECK_MINUTES: '15'
        run: |
          if [ ! -f data/observations.sqlite ]; then python scripts/collect.py; fi
          python scripts/schedule.py --skip-research
      - name: Generate evidence-constrained industry research
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REASONING_MODEL: ${{ vars.REASONING_MODEL }}
          REASONING_EFFORT: ${{ vars.REASONING_EFFORT }}
          REASONING_MAX_DAILY_CALLS: ${{ vars.REASONING_MAX_DAILY_CALLS }}
          REASONING_MAX_OUTPUT_TOKENS: ${{ vars.REASONING_MAX_OUTPUT_TOKENS }}
          REASONING_TIMEOUT_SECONDS: ${{ vars.REASONING_TIMEOUT_SECONDS }}
          REASONING_RETRY_MINUTES: ${{ vars.REASONING_RETRY_MINUTES }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/research_market.py
          python scripts/research_alfred.py
          node scripts/build-investment-research.mjs
      - name: Verify calculations and collectors
        run: |
          node --test tests/calculations.test.mjs
          node --test tests/industry.test.mjs
          node --test tests/research.test.mjs tests/model-runtime.test.mjs tests/research-pipeline.test.mjs
          node --test tests/quant-model.test.mjs tests/research-asof.test.mjs tests/operating-samples.test.mjs
          node --test tests/financial-updates.test.mjs
          node --test tests/research-evolution.test.mjs tests/research-tracking.test.mjs tests/valuation.test.mjs tests/research-robustness.test.mjs tests/research-validation.test.mjs tests/research-attention.test.mjs tests/model-evaluation.test.mjs tests/project-events.test.mjs
          python tests/research_market_test.py
          python tests/research_state_test.py
          python tests/collector_test.py
          python tests/industry_collector_test.py
          python tests/supply_evidence_test.py
          python tests/packaging_evidence_test.py
          python tests/materials_evidence_test.py
          python tests/cross_company_evidence_test.py
          python tests/sector_financials_test.py
          python tests/institution_sources_test.py
          python tests/industry_bootstrap_test.py
          python tests/industry_releases_test.py
          python tests/financial_dynamic_test.py
          python tests/oracle_hpe_dynamic_test.py
          python tests/financial_schedule_test.py
          python tests/financial_sector_updates_test.py
          python tests/policy_rates_test.py
          python tests/policy_decisions_test.py
          python tests/macro_schedule_test.py
          python tests/audit_runner_test.py
          python tests/observation_changes_test.py
          node --test tests/pages-package.test.mjs
          node --test tests/data-health.test.mjs tests/valuation-history.test.mjs
      - name: Check frontend types for a new source version
        if: steps.frontend-proof.outputs.reusable != 'true'
        run: |
          npx tsc --noEmit
      - name: Persist validated cache and revisions
        run: python scripts/github-data-state.py save
      - name: Build website
        if: steps.frontend-proof.outputs.reusable != 'true'
        env:
          PAGES_BASE_PATH: /ai-macro-chain-monitor/
        run: npm run build:pages
      - name: Package fresh data with the verified frontend
        if: steps.frontend-proof.outputs.reusable == 'true'
        env:
          PAGES_BASE_PATH: /ai-macro-chain-monitor/
        run: node scripts/build-pages.mjs --data-only
      - name: Cache frontend only for this source version
        if: steps.frontend-proof.outputs.reusable != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist-pages
          key: ${{ steps.frontend.outputs.cache-primary-key }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
