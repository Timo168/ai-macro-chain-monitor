name: Update data and deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: macro-data-and-pages
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r scripts/requirements.txt
      - name: Restore durable data branch
        run: python scripts/github-data-state.py restore
      - name: Collect official observations and check release calendars
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          MACRO_SCHEDULER: github_actions
          MACRO_CHECK_MINUTES: '15'
        run: |
          if [ ! -f data/observations.sqlite ]; then python scripts/collect.py; fi
          python scripts/schedule.py --skip-research
      - name: Generate evidence-constrained industry research
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REASONING_MODEL: ${{ vars.REASONING_MODEL }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/research_market.py
          python scripts/research_alfred.py
          node scripts/build-investment-research.mjs
      - name: Verify calculations and collectors
        run: |
          node --test tests/calculations.test.mjs
          node --test tests/industry.test.mjs
          node --test tests/research.test.mjs
          node --test tests/quant-model.test.mjs
          node --test tests/financial-updates.test.mjs
          node --test tests/research-evolution.test.mjs tests/research-tracking.test.mjs tests/valuation.test.mjs
          python tests/research_market_test.py
          python tests/collector_test.py
          python tests/industry_collector_test.py
          python tests/sector_financials_test.py
          python tests/institution_sources_test.py
          python tests/industry_bootstrap_test.py
          python tests/industry_releases_test.py
          python tests/financial_dynamic_test.py
          python tests/oracle_hpe_dynamic_test.py
          python tests/financial_schedule_test.py
          python tests/financial_sector_updates_test.py
          python tests/policy_rates_test.py
          python tests/policy_decisions_test.py
          npx tsc --noEmit
      - name: Persist validated cache and revisions
        run: python scripts/github-data-state.py save
      - name: Build website
        env:
          PAGES_BASE_PATH: /ai-macro-chain-monitor/
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
