name: Audit industry data sources

on:
  workflow_dispatch:
  schedule:
    - cron: '18 2 * * *'

permissions:
  contents: write

concurrency:
  group: macro-data-and-pages
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install collector dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Restore durable observations before audit
        id: restore
        run: python scripts/github-data-state.py restore
      - name: Replay public industry sources
        id: audit
        if: always()
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/run-industry-audit.py
      - name: Preserve latest audit outcome even when source checks fail
        if: always() && steps.restore.outcome == 'success'
        run: python scripts/github-data-state.py save
      - name: Upload source audit results and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: industry-source-audit-${{ github.run_id }}
          path: |
            data/industry/audit-status.json
            data/industry/audit-samples.json
            docs/industry/verification.json
            .logs/industry-audit/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: warn
